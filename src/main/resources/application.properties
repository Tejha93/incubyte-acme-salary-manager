spring.application.name=acme-salary-manager
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/acme}
spring.datasource.username=sa
spring.datasource.password=
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
acme.hr.username=${HR_USERNAME:hr}
acme.hr.password=${HR_PASSWORD}
acme.seed.enabled=${SEED_DEMO_DATA:false}
spring.sql.init.mode=always
